<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login Page</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(120deg,#2980b9,#6dd5fa);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    background:white;
    padding:40px;
    border-radius:10px;
    width:320px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.login-box h2{
    text-align:center;
    margin-bottom:20px;
}

.input-group{
    margin-bottom:15px;
}

.input-group input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

.remember{
    margin-bottom:15px;
    font-size:14px;
}

button{
    width:100%;
    padding:10px;
    border:none;
    background:#2980b9;
    color:white;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#1f6391;
}

.register{
    text-align:center;
    margin-top:10px;
}

.register a{
    text-decoration:none;
    color:#2980b9;
}

.error{
    color:red;
    font-size:14px;
    text-align:center;
    margin-bottom:10px;
}

.success{
    color:green;
    font-size:14px;
    text-align:center;
    margin-bottom:10px;
}

</style>

</head>

<body>

<div class="login-box">

<h2>Login</h2>

<div id="message"></div>

<form id="loginForm" action="#" method="post">

<div class="input-group">
<input type="text" id="username" placeholder="Username" required>
</div>

<div class="input-group">
<input type="password" id="password" placeholder="Password" required>
</div>

<div class="remember">
<label>
<input type="checkbox"> Remember me
</label>
</div>

<button type="submit">Login</button>

<div class="register">
<p>Don't have account? <a href="#">Register</a></p>
</div>

</form>

</div>

<script>

document.getElementById("loginForm").addEventListener("submit", function(e){

e.preventDefault();

var username = document.getElementById("username").value;
var password = document.getElementById("password").value;
var message = document.getElementById("message");

if(username === "" || password === ""){
message.innerHTML = "<p class='error'>Please enter username and password</p>";
return;
}

if(username === "admin" && password === "123456"){
message.innerHTML = "<p class='success'>Login successful</p>";
}
else{
message.innerHTML = "<p class='error'>Invalid username or password</p>";
}

});

</script>

</body>
</html>
