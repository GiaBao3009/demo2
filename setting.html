<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cài đặt tài khoản | Settings Page</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
            color: #333;
        }

        /* Hiệu ứng đổ bóng nhẹ cho các khối */
        .settings-card {
            border: none;
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        /* Sidebar Menu */
        .list-group-item {
            border: none;
            padding: 12px 20px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .list-group-item.active {
            background-color: #0d6efd;
            border-radius: 8px;
        }

        .list-group-item:hover:not(.active) {
            background-color: #e9ecef;
            transform: translateX(5px);
        }

        /* Avatar styling */
        .profile-img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Button Hover Animation */
        .btn-save {
            padding: 10px 30px;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(13, 110, 253, 0.3);
        }

        /* Custom Input Focus */
        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.1);
            border-color: #0d6efd;
        }

        .section-title {
            font-weight: 700;
            color: #212529;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <div class="row">
        <div class="col-lg-3 col-md-4 animate__animated animate__fadeInLeft">
            <div class="card settings-card shadow-sm p-3 mb-4">
                <div class="text-center mb-4">
                    <img src="https://ui-avatars.com/api/?name=Admin&background=0D8ABC&color=fff&size=128" alt="Avatar" class="profile-img mb-3">
                    <h5 class="mb-0">Nguyễn Văn A</h5>
                    <p class="text-muted small">Full-stack Developer</p>
                </div>
                <div class="list-group">
                    <a href="#" class="list-group-item list-group-item-action active">
                        Tài khoản
                    </a>
                    <a href="#" class="list-group-item list-group-item-action">Mật khẩu</a>
                    <a href="#" class="list-group-item list-group-item-action">Thông báo</a>
                    <a href="#" class="list-group-item list-group-item-action">Quyền riêng tư</a>
                    <hr>
                    <a href="#" class="list-group-item list-group-item-action text-danger">Đăng xuất</a>
                </div>
            </div>
        </div>

        <div class="col-lg-9 col-md-8 animate__animated animate__fadeInRight">
            <div class="card settings-card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="section-title">Cài đặt hồ sơ</h4>
                    
                    <form id="settingsForm">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label">Họ và tên</label>
                                <input type="text" class="form-control" value="Nguyễn Văn A">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Tên người dùng (Username)</label>
                                <div class="input-group">
                                    <span class="input-group-text">@</span>
                                    <input type="text" class="form-control" value="vanna_dev">
                                </div>
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Địa chỉ Email</label>
                                <input type="email" class="form-control" value="vanna@example.com">
                            </div>
                            <div class="col-md-12">
                                <label class="form-label">Giới thiệu bản thân (Bio)</label>
                                <textarea class="form-control" rows="4">Đam mê lập trình và xây dựng các sản phẩm tuyệt vời.</textarea>
                            </div>
                            
                            <hr class="my-4">
                            
                            <h5 class="mb-3">Tùy chọn hệ thống</h5>
                            <div class="col-md-12">
                                <div class="form-check form-switch mb-3">
                                    <input class="form-check-input" type="checkbox" id="flexSwitchCheckDefault" checked>
                                    <label class="form-check-label" for="flexSwitchCheckDefault">Nhận thông báo qua Email khi có tin nhắn mới</label>
                                </div>
                                <div class="form-check form-switch mb-3">
                                    <input class="form-check-input" type="checkbox" id="flexSwitchCheckChecked">
                                    <label class="form-check-label" for="flexSwitchCheckChecked">Chế độ tối (Dark Mode)</label>
                                </div>
                            </div>
                        </div>

                        <div class="mt-4 text-end">
                            <button type="button" class="btn btn-outline-secondary me-2 btn-save">Hủy</button>
                            <button type="submit" class="btn btn-primary btn-save">Lưu thay đổi</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


</body>
</html>
