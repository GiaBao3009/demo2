<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login Page</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(120deg,#2980b9,#6dd5fa);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.login-box{
    background:white;
    padding:40px;
    border-radius:10px;
    width:320px;
    box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

.login-box h2{
    text-align:center;
    margin-bottom:20px;
}

.input-group{
    margin-bottom:15px;
}

.input-group input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:10px;
    border:none;
    background:#2980b9;
    color:white;
    font-size:16px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#1f6391;
}

.register{
    text-align:center;
    margin-top:10px;
}

.register a{
    text-decoration:none;
    color:#2980b9;
}
</style>

</head>

<body>

<div class="login-box">

<h2>Login</h2>

<form>

<div class="input-group">
<input type="text" placeholder="Username" required>
</div>

<div class="input-group">
<input type="password" placeholder="Password" required>
</div>

<button type="submit">Login</button>

<div class="register">
<p>Don't have account? <a href="#">Register</a></p>
</div>

</form>

</div>

</body>
</html>
